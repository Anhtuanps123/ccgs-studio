# Vai trò trong kế hoạch. Người dùng tick vai trò ở form "Yêu cầu mới"; planner chỉ lên bước cho các vai trò đó,
# và bộ kiểm luật không đòi bước bắt buộc của mẫu khi bước đó thuộc vai trò không được chọn.
# Mỗi skill thuộc đúng một vai trò. Skill không có ở đây thì không có vai trò (planner tự ghi "role" cho bước đó).
roles:
  - id: design
    title: Designer
    hint: Thiết kế gameplay, hệ thống, luật chơi, cân bằng số.
    skills: [brainstorm, quick-design, design-system, design-review, review-all-gdds, map-systems, propagate-design-change, consistency-check, balance-check, scope-check]
  - id: uiux
    title: UI/UX
    hint: Màn hình, popup, HUD, luồng thao tác, bản prototype.
    skills: [ux-design, ux-review, prototype]
  - id: art
    title: Art
    hint: Sprite, màu, font, spec asset theo art thật của game.
    skills: [studio:unity-art-context, art-bible, asset-spec, asset-audit]
  - id: dev
    title: Developer
    hint: Kiến trúc, chia story, viết code, review code.
    skills: [architecture-decision, architecture-review, create-architecture, create-epics, create-stories, story-readiness, dev-story, story-done, code-review, tech-debt, perf-profile]
  - id: qa
    title: Tester
    hint: Kế hoạch test, smoke test, hồi quy, báo lỗi.
    skills: [qa-plan, smoke-check, regression-suite, bug-report, bug-triage, playtest-report, test-evidence-review, soak-test, test-setup]
